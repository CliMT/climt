[tox]
skipsdist=True
envlist = py310, py311, py312, py310-pure, py311-pure, py312-pure, flake8, cov

[testenv:flake8]
basepython=python
deps =
    -r{toxinidir}/requirements_dev.txt
commands=flake8 climt fortran/climt_fortran

[pytest]
markers =
    slow: long-running / integration tests (e.g. RCE to equilibrium, LBL
        validation). Excluded from routine CI; run on demand with `pytest -m slow`.

[flake8]
; Ignoring requirement of space around arithmetic operators
; E241 allowed: numerical kernels and constant tables align values in columns.
ignore = E226,W504,W605,E203,W503,E704,E241
max-line-length = 150

[testenv]
# Non-`pure` environments build and install the real climt-fortran
# extensions and require them (CLIMT_REQUIRE_FORTRAN=1 turns a missing
# extension into a failure instead of a skip). `pure` environments install
# the climt-fortran stub (CLIMT_FORTRAN_STUB=1, no binaries) and check that
# climt runs without the extensions.
# passenv = CC FC
passenv = *
PYTHONPATH = {toxinidir}:{toxinidir}/climt
setenv =
    !pure: CLIMT_REQUIRE_FORTRAN = 1
    pure: CLIMT_FORTRAN_STUB = 1
deps =
    -r{toxinidir}/requirements_dev.txt
    # linepyline gates the cork LBL validation test. Not on PyPI;
    # installed from GitHub here so CI exercises that test.
    git+https://github.com/rodrigo-caballero/linepyline
commands =
    pip install -U pip
    !pure: pip install -e ./fortran
    pure: pip install ./fortran
    pip install -e .
    pure: python -c "import climt; assert not climt.has_fortran_extensions()"
    py.test fortran/tests tests --basetemp={envtmpdir} -v -m "not slow"

[testenv:cov]
# necessary to make cov find the .coverage file
# see http://blog.ionelmc.ro/2014/05/25/python-packaging/
passenv = *
setenv =
    CLIMT_REQUIRE_FORTRAN = 1
commands =
    pip install codecov
    pip install -e ./fortran
    pip install -e .
    py.test fortran/tests tests --cov=climt -m "not slow"
    codecov --token=bf3cc931-f345-4a8f-b4d9-fe636bad4a38
deps =
    -r{toxinidir}/requirements_dev.txt

; If you want to make tox run the tests with the same versions, create a
; requirements.txt with the pinned versions and uncomment the following lines:
; deps =
;     -r{toxinidir}/requirements.txt
