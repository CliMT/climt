[tox]
skipsdist=True
envlist = py39, py310, py311, py312, flake8, cov

[testenv:flake8]
basepython=python
deps =
    -r{toxinidir}/requirements_dev.txt
commands=flake8 climt

[pytest]
markers =
    slow: long-running / integration tests (e.g. RCE to equilibrium, LBL
        validation). Excluded from routine CI; run on demand with `pytest -m slow`.

[flake8]
; Ignoring requirement of space around arithmetic operators
; E241 allowed: numerical kernels and constant tables align values in columns.
ignore = E226,W504,W605,E203,W503,E704,E241
max-line-length = 150

[testenv]
# passenv = CC FC
passenv = *
PYTHONPATH = {toxinidir}:{toxinidir}/climt
deps =
    -r{toxinidir}/requirements_dev.txt
    # linepyline gates the cork LBL validation test. Not on PyPI;
    # installed from GitHub here so CI exercises that test.
    git+https://github.com/rodrigo-caballero/linepyline
commands =
    pip install -U pip
    pip install -e .
    python setup.py build_ext --inplace
    py.test --basetemp={envtmpdir} -v -m "not slow"

[testenv:cov]
# necessary to make cov find the .coverage file
# see http://blog.ionelmc.ro/2014/05/25/python-packaging/
passenv = *
commands =
    pip install codecov
    pip install -e .
    python setup.py build_ext --inplace
    py.test --cov=climt -m "not slow"
    codecov --token=bf3cc931-f345-4a8f-b4d9-fe636bad4a38
deps =
    -r{toxinidir}/requirements_dev.txt

; If you want to make tox run the tests with the same versions, create a
; requirements.txt with the pinned versions and uncomment the following lines:
; deps =
;     -r{toxinidir}/requirements.txt
