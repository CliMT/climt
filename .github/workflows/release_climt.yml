name: Publish in GitHub Package Registry

on:
    release:
        types: [published]

jobs:
    build_wheels:
        name: Build wheels on ${{ matrix.os }}
        # Prereleases (e.g. the in-browser docs demo wheel) must not build the
        # platform wheels or publish to PyPI. Only build-pure-wheel runs for them.
        if: ${{ !github.event.release.prerelease }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macOS-latest]
                #[ubuntu-20.04,macOS-11]
                #, windows-2019, macOS-10.15]

        steps:
            - uses: actions/checkout@v4

            # Used to host cibuildwheel
            - uses: actions/setup-python@v5

            - name: Set up QEMU
              if: runner.os == 'Linux'
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: all

            - name: Install cibuildwheel
              run: python -m pip install cibuildwheel==3.3.1

            - name: Build on Linux
              env:
                  CIBW_BUILD: cp310-* cp311-* cp312-*
                  CIBW_SKIP: "*-musllinux_*"
                  CIBW_ARCHS_LINUX: "x86_64"
                  CIBW_ENVIRONMENT: "CC=gcc FC=gfortran CLIMT_ARCH=Linux"
              if: ${{ runner.os == 'Linux' }}
              run: python -m cibuildwheel --output-dir dist

            - name: Build on macOS
              env:
                  CIBW_BUILD: cp310-* cp311-* cp312-*
                  CIBW_ARCHS_MACOS: "arm64"
                  CIBW_ENVIRONMENT: "CLIMT_ARCH=Darwin MACOSX_DEPLOYMENT_TARGET=15.0"
              if: ${{ runner.os == 'macOS' }}
              run: python -m cibuildwheel --output-dir dist

            - name: Store the distribution packages
              uses: actions/upload-artifact@v4
              with:
                  name: python-package-distributions-${{ matrix.os }}
                  path: dist/
    publish-to-pypi:
        name: Publishing to PyPI
        if: ${{ !github.event.release.prerelease }}
        needs:
            - build_wheels
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/climt # Replace <package-name> with your PyPI project name
        permissions:
            id-token: write # IMPORTANT: mandatory for trusted publishing
        steps:
            - name: Download all the dists
              uses: actions/download-artifact@v4
              with:
                  pattern: python-package-distributions-*
                  merge-multiple: true
                  path: dist/
            - name: Publish wheels to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
        #   # - name: upload wheels
        #   #   env:
        #   #     TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
        #   #     TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        #   #   run: twine upload wheelhouse/* --verbose
    build-pure-wheel:
        name: Build pure-Python wheel
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Build pure-Python wheel
              env:
                  CLIMT_PURE_PYTHON: "1"
              run: |
                  python -m pip install --upgrade pip build
                  python -m build --wheel
                  ls dist/*-py3-none-any.whl
            - name: Attach to release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/*-py3-none-any.whl
