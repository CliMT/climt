name: Publish climt to PyPI

# climt is pure Python: one sdist and one py3-none-any wheel. The compiled
# extensions are released separately as climt-fortran
# (release_climt_fortran.yml, tags fortran-v*).
on:
    release:
        types: [published]

jobs:
    build:
        name: Build sdist and pure-Python wheel
        if: ${{ startsWith(github.event.release.tag_name, 'v') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Build sdist and wheel
              run: |
                  python -m pip install --upgrade pip build
                  python -m build
            - name: Check distributions
              run: |
                  ls dist/
                  test "$(ls dist/*-py3-none-any.whl | wc -l)" -eq 1
                  test "$(ls dist/*.tar.gz | wc -l)" -eq 1
            # The in-browser docs demo installs this wheel from the release.
            - name: Attach wheel to release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/*-py3-none-any.whl
            - name: Store the distribution packages
              uses: actions/upload-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/
    publish-to-pypi:
        name: Publishing to PyPI
        if: ${{ !github.event.release.prerelease }}
        needs:
            - build
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/climt
        permissions:
            id-token: write # IMPORTANT: mandatory for trusted publishing
        steps:
            - name: Download the dists
              uses: actions/download-artifact@v4
              with:
                  name: python-package-distributions
                  path: dist/
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
