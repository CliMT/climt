quartodoc:
  package: climt
  dir: api
  title: "API Reference"
  style: pkgdown
  sections:
    - title: "Radiation"
      desc: "Longwave and shortwave radiation components."
      contents:
        - RRTMGLongwave
        - RRTMGShortwave
        - GrayLongwaveRadiation
        - Frierson06LongwaveOpticalDepth
    - title: "Picket-fence radiation"
      desc: "Non-grey correlated-k / Parmentier scheme."
      contents:
        - name: PicketFenceLongwave
          package: climt._components.picket_fence.lw.component
        - name: PicketFenceShortwave
          package: climt._components.picket_fence.sw.component
    - title: "Convection"
      contents:
        - EmanuelConvection
        - DryConvectiveAdjustment
    - title: "Surface & ice"
      contents:
        - SlabSurface
        - IceSheet
        - BucketHydrology
    - title: "Solar & insolation"
      contents:
        - BergerSolarInsolation
        - Instellation
        - HeldSuarez
    - title: "State & grid utilities"
      contents:
        - get_default_state
        - get_grid
        - mass_to_volume_mixing_ratio
        - get_interface_values
    - title: "Constants"
      contents:
        - list_available_constants
        - set_constants_from_dict
        - load_atmospheric_properties
        - reset_atmospheric_properties
