quartodoc:
  package: climt
  dir: api
  title: "API Reference"
  style: pkgdown
  sections:
    - title: "Radiation"
      desc: "Longwave and shortwave radiation components."
      contents:
        - RRTMGLongwave
        - RRTMGShortwave
        - GrayLongwaveRadiation
        - Frierson06LongwaveOpticalDepth
    - title: "Cork radiation"
      desc: "Non-grey correlated-k (CORK) scheme."
      contents:
        - name: CorkLongwaveRadiation
          package: climt._components.cork.lw.component
        - name: CorkShortwaveRadiation
          package: climt._components.cork.sw.component
    - title: "Convection & condensation"
      contents:
        - EmanuelConvection
        - DryConvectiveAdjustment
        - GridScaleCondensation
    - title: "Surface & ice"
      contents:
        - SlabSurface
        - IceSheet
        - SeaIce
        - LandIce
        - BucketHydrology
        - SecondBEST
    - title: "Ocean & land surface data"
      contents:
        - LandMask
        - DataOcean
    - title: "Solar & insolation"
      contents:
        - BergerSolarInsolation
        - Instellation
        - HeldSuarez
    - title: "Idealised & test physics"
      contents:
        - SimplePhysics
        - DcmipInitialConditions
    - title: "State & grid utilities"
      contents:
        - get_default_state
        - get_grid
        - mass_to_volume_mixing_ratio
        - get_interface_values
    - title: "Constants"
      contents:
        - list_available_constants
        - set_constants_from_dict
        - load_atmospheric_properties
        - reset_atmospheric_properties
