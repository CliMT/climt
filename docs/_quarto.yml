# HTML appearance, declared at the *top level* rather than under `format: html:`
# on purpose. The Modelling Tour pages and radiative-transfer/09-live-rce.qmd set
# `format: live-html` -- a separate format contributed by the r-wasm/live
# extension -- and Quarto merges a `format: html:` block only into documents whose
# format is literally `html`. Those pages therefore rendered against bare `cosmo`
# with no climt.scss, visibly out of step with the rest of the site. Top-level
# keys are merged into every format the project produces, `live-html` included.
theme:
  - cosmo
  - climt.scss
toc: true
code-fold: false
code-tools: true

format:
  html: default

bibliography: ../references.bib

quartodoc:
  package: climt
  dir: api
  title: "API Reference"
  style: pkgdown
  sections:
    - title: "Radiation"
      desc: "Longwave and shortwave radiation components."
      contents:
        - RRTMGLongwave
        - RRTMGShortwave
        - GrayLongwaveRadiation
        - Frierson06LongwaveOpticalDepth
    - title: "Cork radiation"
      desc: "Non-grey correlated-k (CORK) scheme."
      contents:
        - name: CorkLongwaveRadiation
          package: climt._components.cork.lw.component
        - name: CorkShortwaveRadiation
          package: climt._components.cork.sw.component
    - title: "Convection & condensation"
      contents:
        - EmanuelConvection
        - DryConvectiveAdjustment
        - GridScaleCondensation
    - title: "Surface & ice"
      contents:
        - SlabSurface
        - IceSheet
        - BucketHydrology
    - title: "Solar & insolation"
      contents:
        - BergerSolarInsolation
        - Instellation
        - HeldSuarez
    - title: "Idealised & test physics"
      contents:
        - SimplePhysics
        - DcmipInitialConditions
    - title: "State & grid utilities"
      contents:
        - get_default_state
        - get_grid
        - mass_to_volume_mixing_ratio
        - get_interface_values
    - title: "Constants"
      contents:
        - list_available_constants
        - set_constants_from_dict
        - load_atmospheric_properties
        - reset_atmospheric_properties
