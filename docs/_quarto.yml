project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "get-started/**/*.qmd"
    - "user-guide/**/*.qmd"
    - "radiative-transfer/**/*.qmd"
    - "modelling-tour/**/*.qmd"
    - "experiments/**/*.qmd"
    - "api/**/*.qmd"
  resources:
    # Quarto omits underscore-prefixed paths from the site by default. The
    # Modelling Tour's helper modules must be *served*, not just rendered: the
    # live pages hand these paths to quarto-live's `pyodide: resources:`, which
    # fetches them over HTTP into the Pyodide filesystem so the browser imports
    # the same code tests/test_modelling_tour.py exercises natively.
    - "modelling-tour/_tour/*.py"
    # Same mechanism, for the high-resolution spectrum table. It is ~5 MB, too
    # large to ship inside the climt wheel, so pages that want a finely
    # resolved spectrum fetch it from the site instead — which works only
    # because the site is same-origin with the page (a GitHub release asset
    # sends no CORS headers). See docs/modelling-tour/_tour/tables.py.
    - "modelling-tour/_data/*.npz"
    # Static fallback figures for the live cells, for readers whose browser
    # blocks WebAssembly. Underscore-prefixed again, so again listed here --
    # without this the pages render with broken images and nothing says so.
    - "modelling-tour/_artifacts/*.png"

