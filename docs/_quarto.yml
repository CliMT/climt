# docs/_quarto.yml
# Minimal, forward-compatible seed of the full climt-website config
# (docs/superpowers/specs/2026-05-18-climt-website-design.md). The site
# migration extends this with nav, theme, and quartodoc; nothing here may
# contradict that spec.
project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "experiments/**/*.qmd"

website:
  title: "climt"
  repo-url: https://github.com/CliMT/climt
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Experiments"
        href: experiments/index.qmd
    right:
      - icon: github
        href: https://github.com/CliMT/climt

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    code-tools: true

bibliography: ../references.bib
