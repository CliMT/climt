# docs/radiative-transfer/sources.yml
# Walkthrough chapter figures. Paths in `out` are relative to this file's dir;
# `cmd`/`deps` paths are relative to the repo root. The driver
# (scripts/build_experiments.py, `make experiments`) content-hashes deps and
# only re-runs stale artifacts.
#
# NOTE: figures 02_lbl_H2O_1000_1200 and 04_correlation_across_T are
# line-by-line and require the optional `linepyline` package. Their functions in
# _figures.py print-and-skip when it is absent, producing no PNG — and the build
# driver fails any manifest command that writes no output file. They are
# therefore intentionally NOT listed here: regenerate them by hand on a machine
# with `linepyline` installed and commit the resulting PNGs as frozen artifacts
# (same approach the experiments manifest takes for kg_window_band.png):
#   python docs/radiative-transfer/_figures.py --figure 02_lbl_H2O_1000_1200 \
#       --out docs/radiative-transfer/_artifacts/02_lbl_H2O_1000_1200.png
artifacts:
  - out: _artifacts/01_mean_of_exp.png
    cmd: conda run --no-capture-output -n climt python docs/radiative-transfer/_figures.py --figure 01_mean_of_exp --out docs/radiative-transfer/_artifacts/01_mean_of_exp.png
    deps:
      - docs/radiative-transfer/_figures.py
  - out: _artifacts/03_k_distribution_construction.png
    cmd: conda run --no-capture-output -n climt python docs/radiative-transfer/_figures.py --figure 03_k_distribution_construction --out docs/radiative-transfer/_artifacts/03_k_distribution_construction.png
    deps:
      - docs/radiative-transfer/_figures.py
  - out: _artifacts/06_picket_fence_opacity.png
    cmd: conda run --no-capture-output -n climt python docs/radiative-transfer/_figures.py --figure 06_picket_fence_opacity --out docs/radiative-transfer/_artifacts/06_picket_fence_opacity.png
    deps:
      - docs/radiative-transfer/_figures.py
      - climt/_components/cork/optics/parmentier.py
  - out: _artifacts/07_two_stream_phases.png
    cmd: conda run --no-capture-output -n climt python docs/radiative-transfer/_figures.py --figure 07_two_stream_phases --out docs/radiative-transfer/_artifacts/07_two_stream_phases.png
    deps:
      - docs/radiative-transfer/_figures.py
      - climt/_components/cork/sw/kernels.py
